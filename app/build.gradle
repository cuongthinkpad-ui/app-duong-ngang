plugins { id 'com.android.application' }
android {
    namespace 'vn.duongngang.monitor'
    compileSdk 35
    defaultConfig { applicationId 'vn.duongngang.monitor'; minSdk 26; targetSdk 34; versionCode 23; versionName '0.23.0'; testInstrumentationRunner 'vn.duongngang.monitor.RouteStoreChecks' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'; implementation 'org.jsoup:jsoup:1.18.3' }

// Signing metadata stays outside Git; only its path is passed to the build.
def railSigningInfo = System.getenv('DUONG_NGANG_SIGNING_INFO')
if (railSigningInfo) {
    def metadataFile = file(railSigningInfo)
    def signing = new groovy.json.JsonSlurper().parse(metadataFile)
    android.signingConfigs.debug {
        storeFile new File(metadataFile.parentFile, 'debug.keystore')
        storePassword signing.store_password
        keyAlias signing.alias
        keyPassword signing.key_password
    }
}
